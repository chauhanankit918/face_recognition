name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Also run the real-model InsightFace tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  DJANGO_SETTINGS_MODULE: face_recognise.settings

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # opencv links against libGL/glib even when it is only imported.
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install coverage

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Unit tests
        # Explicit labels: a bare `manage.py test` would also collect the
        # real-model integration module.
        run: |
          coverage run manage.py test users services.tests --verbosity 2 --shuffle
          coverage report
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

      - name: Deployment checklist
        # Advisory: fails until the deployment env is fully populated.
        continue-on-error: true
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-not-a-real-secret-key-000000000000' }}
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: face-recognise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image and prove the API answers. /api/auth/me/ must reject an
      # anonymous caller with 401 — that exercises URLs, DRF auth and the DB.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY=smoke-test-key-not-a-real-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            face-recognise:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me/ || true)
            [ "$code" = "401" ] && echo "API is up" && exit 0
            sleep 2
          done
          echo "container never became healthy (last code: ${code:-none})"
          docker logs smoke
          exit 1

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  integration:
    name: Real-model tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The ~330 MB buffalo_l pack; InsightFace only looks in ~/.insightface.
      - name: Cache the model pack
        uses: actions/cache@v4
        with:
          path: ~/.insightface
          key: insightface-buffalo_l

      - run: python manage.py test services.test_engine_integration --verbosity 2
